# CSDL dùng cho test: nạp migrations rồi seeds (database/init-test-db.sh).
# Chạy: docker compose -f docker-compose.test.yml up -d --wait
# Bỏ:   docker compose -f docker-compose.test.yml down -v
# Cổng 3307 để không đụng CSDL dev (3306). Dùng MariaDB 10.11 cho khớp hosting (10.11.13).
services:
  db-test:
    image: mariadb:10.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: sports_court_booking
    ports:
      - "3307:3306"
    volumes:
      - ./database:/sql:ro
      - ./database/init-test-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
