$kind: http-request
method: POST
url: '{{base_url}}/facilities/{{facility_id}}/pricing-rules'
order: 8200
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "rules": [
        {
          "name": "Giờ vàng 17h-21h",
          "rule_type": "PEAK_HOUR",
          "multiplier": 1.6,
          "start_time": "17:00:00",
          "end_time": "21:00:00",
          "day_of_week": null,
          "holiday_id": null
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("SAN-05: status 422", () => pm.response.to.have.status(422));
      pm.test("SAN-05: mã lỗi VALIDATION_ERROR", () => pm.expect(pm.response.json().error.code).to.eql("VALIDATION_ERROR"));
