$kind: http-request
method: PATCH
url: '{{base_url}}/courts/{{court_id}}'
order: 7300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "close_time": "22:00:00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("SAN-08: 200, close_time = 22:00:00", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.close_time).to.eql("22:00:00");
      });
