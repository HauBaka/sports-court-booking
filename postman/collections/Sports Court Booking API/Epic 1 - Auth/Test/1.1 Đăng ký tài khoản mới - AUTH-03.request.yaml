$kind: http-request
method: POST
url: '{{base_url}}/auth/register'
order: 1300
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Nguyễn Văn A",
      "email": "new.user@scb.vn",
      "phone": "0900000003",
      "password": "{{user_password}}",
      "role": "customer",
      "otp_code": "{{otp_code}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 1.5: xin OTP trước. Local và CI (console, không production) mã luôn là 123456.
      pm.sendRequest({url: pm.environment.get("base_url") + "/auth/otp", method: "POST",
        header: {"Content-Type": "application/json"},
        body: {mode: "raw", raw: JSON.stringify({email: "new.user@scb.vn", purpose: "REGISTER"})}
      }, () => {});
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("AUTH-03: status 409", () => pm.response.to.have.status(409));
      pm.test("AUTH-03: mã lỗi AUTH_PHONE_EXISTS", () => pm.expect(pm.response.json().error.code).to.eql("AUTH_PHONE_EXISTS"));
