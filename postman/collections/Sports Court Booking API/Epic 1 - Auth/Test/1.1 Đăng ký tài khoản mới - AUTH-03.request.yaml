$kind: http-request
method: POST
url: '{{base_url}}/auth/register'
order: 1300
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Nguyễn Văn A",
      "email": "new.user@scb.vn",
      "phone": "0900000003",
      "password": "{{user_password}}",
      "role": "customer"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("AUTH-03: status 409", () => pm.response.to.have.status(409));
      pm.test("AUTH-03: mã lỗi AUTH_PHONE_EXISTS", () => pm.expect(pm.response.json().error.code).to.eql("AUTH_PHONE_EXISTS"));
