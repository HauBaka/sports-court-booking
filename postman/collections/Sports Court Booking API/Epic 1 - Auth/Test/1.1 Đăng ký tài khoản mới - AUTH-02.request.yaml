$kind: http-request
method: POST
url: '{{base_url}}/auth/register'
order: 1200
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Nguyễn Văn A",
      "email": "{{user_email}}",
      "phone": "0900000010",
      "password": "{{user_password}}",
      "role": "customer",
      "otp_code": "{{otp_code}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 1.5: xin OTP trước. Local và CI (console, không production) mã luôn là 123456.
      pm.sendRequest({url: pm.environment.get("base_url") + "/auth/otp", method: "POST",
        header: {"Content-Type": "application/json"},
        body: {mode: "raw", raw: JSON.stringify({email: pm.environment.get("user_email"), purpose: "REGISTER"})}
      }, () => {});
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("AUTH-02: status 409", () => pm.response.to.have.status(409));
      pm.test("AUTH-02: mã lỗi AUTH_EMAIL_EXISTS", () => pm.expect(pm.response.json().error.code).to.eql("AUTH_EMAIL_EXISTS"));
