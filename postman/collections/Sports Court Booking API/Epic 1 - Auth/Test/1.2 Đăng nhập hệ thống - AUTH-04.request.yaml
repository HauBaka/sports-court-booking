$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 2100
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{user_email}}",
      "password": "SaiMatKhau123@"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("AUTH-04: status 401", () => pm.response.to.have.status(401));
      pm.test("AUTH-04: mã lỗi AUTH_INVALID_CREDENTIALS", () => pm.expect(pm.response.json().error.code).to.eql("AUTH_INVALID_CREDENTIALS"));
      pm.test("AUTH-04: không có access_token", () => pm.expect(pm.response.text()).to.not.include("access_token"));
