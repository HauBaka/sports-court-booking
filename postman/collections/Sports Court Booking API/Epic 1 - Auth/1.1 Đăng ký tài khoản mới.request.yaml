$kind: http-request
method: POST
url: '{{base_url}}/auth/register'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Nguyễn Văn A",
      "email": "customer@example.com",
      "phone": "0901234567",
      "password": "SecurePassword123@",
      "role": "customer",
      "otp_code": "{{otp_code}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 1.5: xin OTP trước. Local và CI (console, không production) mã luôn là 123456.
      pm.sendRequest({url: pm.environment.get("base_url") + "/auth/otp", method: "POST",
        header: {"Content-Type": "application/json"},
        body: {mode: "raw", raw: JSON.stringify({email: "customer@example.com", purpose: "REGISTER"})}
      }, () => {});
