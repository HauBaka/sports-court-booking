<!DOCTYPE html>
<html lang="vi" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis Report – Hệ thống Quản lý và Đặt sân Thể thao</title>
<script>(function(){var t=null;try{t=localStorage.getItem('pp-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
<style>:root{--bg:#f4f6f9;--paper:#fff;--ink:#18222e;--muted:#5a6776;--line:#dde2e9;--soft:#eef2f6;--accent:#1c5d8f;--accent-soft:#e4eef7;--code:#eef2f6;
--hi:#1c5d8f;--hi-bg:#e1edf8;--lo:#566474;--lo-bg:#e9edf1;--rhi:#9a3412;--rhi-bg:#fde7da;--rmid:#7c5800;--rmid-bg:#fbefc9;--rlo:#2f6b46;--rlo-bg:#dff1e5;--shadow:0 1px 2px rgba(20,30,45,.06)}
:root[data-theme="dark"]{--bg:#0e1319;--paper:#151b23;--ink:#e3e9f0;--muted:#98a6b5;--line:#27313c;--soft:#1b232d;--accent:#7ab6e6;--accent-soft:#1a2a3a;--code:#1b232d;
--hi:#8cc4ee;--hi-bg:#1b3248;--lo:#a4b1bf;--lo-bg:#232d38;--rhi:#f4a47a;--rhi-bg:#43241a;--rmid:#e9c566;--rmid-bg:#3b2f12;--rlo:#7fd1a2;--rlo-bg:#173326;--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0e1319;--paper:#151b23;--ink:#e3e9f0;--muted:#98a6b5;--line:#27313c;--soft:#1b232d;--accent:#7ab6e6;--accent-soft:#1a2a3a;--code:#1b232d}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
.bar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.bar-title strong{font-size:15px}
.bar-title span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:background-color .15s,border-color .15s}
.bar button:hover{background:var(--soft);border-color:var(--accent)}
.bar .menu{display:none}
.theme .i-moon{display:none}
:root[data-theme="dark"] .theme .i-sun{display:none}
:root[data-theme="dark"] .theme .i-moon{display:block}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;max-width:1680px;margin:0 auto;padding:28px 24px 72px}
nav{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 108px);overflow:auto;font-size:14px;padding-right:6px}
.nav-h{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
nav a{display:block;color:var(--muted);text-decoration:none;padding:4px 10px;border-left:2px solid transparent;line-height:1.45;border-radius:0 6px 6px 0}
nav a.n1{color:var(--ink);font-weight:650;margin-top:10px}
nav a.n4{padding-left:22px;font-size:13.5px}
nav a:hover{background:var(--soft);color:var(--accent)}
nav a.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.scrim{display:none}
main{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 48px 56px;box-shadow:var(--shadow);transition:background-color .2s,border-color .2s}
.cover{padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.cover h3{margin:0;font-size:.95rem;font-weight:600;color:var(--muted);line-height:1.6}
.cover .course{margin:22px 0 4px;font-weight:700;color:var(--accent);font-size:1.02rem}
.cover h2{margin:0 0 22px;font-size:2.7rem;line-height:1.15;letter-spacing:-.02em}
.fields{display:grid;gap:8px}
.field{background:var(--soft);border-radius:10px;padding:10px 16px}
.field .k{color:var(--muted);font-weight:600;margin-right:6px}
.field .v{font-weight:600}
.toc-card{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px 24px;margin-bottom:8px}
.toc-title{margin:0 0 8px;font-weight:700}
.toc-card ul{list-style:none;margin:0;padding-left:0}
.toc-card ul ul{padding-left:20px}
.toc-card li{margin:2px 0}
.toc-card a{color:var(--accent);text-decoration:none}
.toc-card a:hover{text-decoration:underline}
.running{margin:28px 0 0;color:var(--muted);font-size:.9rem}
h1{margin:48px 0 16px;padding-top:28px;border-top:1px solid var(--line);font-size:1.7rem;line-height:1.3;letter-spacing:-.01em;scroll-margin-top:80px}
h1:first-of-type{margin-top:20px}
h4{margin:34px 0 10px;padding-left:12px;border-left:3px solid var(--accent);font-size:1.12rem;line-height:1.4;scroll-margin-top:80px}
p{margin:12px 0}
ul,ol{margin:10px 0;padding-left:26px}
li{margin:5px 0}
li::marker{color:var(--muted)}
a{color:var(--accent)}
code{font-family:"Cascadia Mono","Consolas","DejaVu Sans Mono","Menlo","Liberation Mono",monospace;font-size:.88em;background:var(--code);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
pre{margin:16px 0;padding:18px 20px;background:var(--code);border:1px solid var(--line);border-radius:10px;overflow-x:auto;line-height:1.15}
pre code{background:none;padding:0;font-size:.8rem;overflow-wrap:normal;white-space:pre}
.tw{margin:18px 0;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:650;font-size:.88rem}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--soft)}
.fc td:first-child,.fc th:first-child{white-space:nowrap;font-weight:650}
.pill{display:inline-block;padding:0 10px;border-radius:999px;font-size:.85em;font-weight:650;line-height:1.7}
.pill.hi{background:var(--hi-bg);color:var(--hi)}.pill.lo{background:var(--lo-bg);color:var(--lo)}
.pill.rhi{background:var(--rhi-bg);color:var(--rhi)}.pill.rmid{background:var(--rmid-bg);color:var(--rmid)}.pill.rlo{background:var(--rlo-bg);color:var(--rlo)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:960px){
.bar .menu{display:inline-grid}
.shell{grid-template-columns:1fr;gap:0;padding:14px 12px 56px}
nav{position:fixed;z-index:25;inset:0 auto 0 0;height:auto;width:290px;max-height:none;background:var(--paper);border-right:1px solid var(--line);padding:72px 16px 16px;transform:translateX(-100%);transition:transform .2s}
nav.open{transform:none}
.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
main{padding:26px 18px 36px;border-radius:12px}
.cover h2{font-size:2rem}
}
@media print{
:root,:root[data-theme="dark"]{--bg:#fff;--paper:#fff;--ink:#000;--muted:#444;--line:#bbb;--soft:#f2f2f2;--accent:#124a75;--accent-soft:#eee;--code:#f2f2f2}
body{font-size:12px;background:#fff}
.bar,nav,.scrim{display:none}
.shell{display:block;padding:0}
main{border:0;padding:0;box-shadow:none}
.tw,pre,tr{break-inside:avoid}
h1,h4{break-after:avoid}
.pill{border:1px solid #888;background:none!important;color:#000!important}
}

.cover{text-align:center}
.cover h3{margin:0;font-size:1.3rem;font-weight:700;color:var(--ink);line-height:1.5;letter-spacing:.01em}
.cover .course{margin:12px 0 0;font-size:1.3rem;font-weight:700;color:var(--accent);line-height:1.5;letter-spacing:.01em}
.cover h2{margin:26px 0 24px}
.fields{max-width:620px;margin:0 auto;text-align:center}
@media (max-width:960px){.cover h3,.cover .course{font-size:1.1rem}}

/* ===== Mục lục ===== */
.tg{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;transition:background-color .15s,color .15s}
.tg:hover{background:var(--soft);color:var(--accent)}
.tg::before{content:"";width:7px;height:7px;margin-top:-3px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .18s,margin .18s}
.tg[aria-expanded="false"]::before{transform:rotate(-45deg);margin-top:0}
.tools{display:flex;gap:4px;flex:none}
.tl{font:inherit;font-size:12.5px;line-height:1;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--muted);cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.tl:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}
/* sidebar */
.nav-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}
.nav-top .nav-h{margin:0}
.ng{margin-top:8px}
.nrow{display:flex;align-items:flex-start;gap:2px}
.nrow>a.n1{flex:1;min-width:0;margin-top:0}
.nrow .tg{margin-top:2px}
.nsub{display:grid;grid-template-rows:1fr;transition:grid-template-rows .2s ease}
.nsub>div{overflow:hidden;min-height:0;transition:visibility .2s}
.ng.c .nsub{grid-template-rows:0fr}
.ng.c .nsub>div{visibility:hidden}
/* mục lục trong trang */
.toc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.toc-top .toc-title{margin:0}
.toc-card li.has-sub>.trow{display:flex;align-items:center;gap:4px}
.toc-card li.no-sub>a{margin-left:30px}
.toc-card ul ul{padding-left:50px}
.toc-card li.c>ul{display:none}

/* ===== Highlight ===== */
:root{--k-num-bg:#fde2e8;--k-num-fg:#9b1c3c;--k-ref-bg:#e1edf8;--k-ref-fg:#1c5d8f;--k-tech-bg:#dff1e5;--k-tech-fg:#1e6a42;--k-role-bg:#d8f0f3;--k-role-fg:#0e6572}
:root[data-theme="dark"]{--k-num-bg:#4a2030;--k-num-fg:#f4a9bd;--k-ref-bg:#1b3248;--k-ref-fg:#8cc4ee;--k-tech-bg:#173326;--k-tech-fg:#7fd1a2;--k-role-bg:#11323a;--k-role-fg:#7fd2de}
.hl,.sw{border-radius:4px;padding:0 3px;margin:0 -1px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-num,.sw.hl-num{background:var(--k-num-bg);color:var(--k-num-fg);font-weight:700}
.hl-ref,.sw.hl-ref{background:var(--k-ref-bg);color:var(--k-ref-fg);font-weight:700}
.hl-tech,.sw.hl-tech{background:var(--k-tech-bg);color:var(--k-tech-fg)}
.hl-role,.sw.hl-role{background:var(--k-role-bg);color:var(--k-role-fg)}
.hl-off-num main .hl-num,.hl-off-ref main .hl-ref,.hl-off-tech main .hl-tech,.hl-off-role main .hl-role{background:none;color:inherit;font-weight:inherit;padding:0;margin:0}
tbody tr:hover td .hl{box-shadow:0 0 0 1px var(--line)}
/* bảng chú giải */
.hl-btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.hl-panel{position:absolute;top:62px;right:16px;width:300px;max-width:calc(100vw - 32px);padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(10,20,35,.18);font-size:14px;line-height:1.5}
.hl-panel[hidden]{display:none}
.hl-panel h5{margin:0 0 8px;font-size:14px}
.hl-panel label{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;border-radius:8px;cursor:pointer}
.hl-panel label:hover{background:var(--soft)}
.hl-panel input{margin:4px 0 0;accent-color:var(--accent);flex:none}
.hl-panel .sw{display:inline-block;margin:0 0 2px;font-size:13px}
.hl-panel .nm{display:block;font-weight:650}
.hl-panel .ex{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.hl-panel .ex .sw{margin:0;font-size:12.5px}
.hl-panel .all{border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;margin-bottom:4px;padding-bottom:8px;font-weight:650}

@media print{
.tg,.tools,.hl-panel,.hl-btn{display:none!important}
.toc-card li.c>ul{display:block!important}
.hl{background:none!important;color:#000!important;font-weight:inherit;padding:0;margin:0;border-bottom:1px dotted #666;border-radius:0}
.cover h3,.cover .course{font-size:15pt}
}

/* ===== Analysis Report: thêm ===== */
h5{margin:26px 0 8px;font-size:1rem;color:var(--accent);scroll-margin-top:80px}
.tab-panel>h5:first-child{margin-top:4px}
.todo{background:var(--rmid-bg);color:var(--rmid);font-weight:650;padding:0 6px;border-radius:4px}
.tabs{margin:14px 0 24px}
.tab-bar{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab-bar button{font:inherit;font-size:.88rem;font-weight:650;cursor:pointer;background:var(--soft);color:var(--muted);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:7px 14px;margin-bottom:-1px;transition:background-color .15s,color .15s}
.tab-bar button:hover{color:var(--accent)}
.tab-bar button.on{background:var(--paper);color:var(--accent);border-color:var(--accent);border-bottom:1px solid var(--paper)}
.tab-panel{display:none}.tab-panel.on{display:block}
.mermaid{margin:16px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow-x:auto;text-align:center;color:#18222e}
.fallback{white-space:pre-wrap;font:13px/1.6 ui-monospace,Consolas,monospace}
@media print{.tab-bar{display:none}.tab-panel{display:block!important}}

.ucfig{margin:16px 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow-x:auto;text-align:center}
.ucfig img{max-width:100%;height:auto}
.ucfig a{display:block}.ucfig img{width:100%;cursor:zoom-in}.ucnote{margin-top:6px;font-size:.8rem;color:#5a6776}
.ucfig svg{width:100%;height:auto;display:block}.ucfig{padding:8px}
img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block;margin:10px 0 18px;background:#fff}
.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.split-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 100px);overflow:auto}
.split-nav button{font:inherit;font-size:.86rem;text-align:left;cursor:pointer;padding:8px 12px;border:1px solid transparent;border-left:3px solid var(--line);border-radius:0 8px 8px 0;background:none;color:var(--muted);line-height:1.4}
.split-nav button:hover{background:var(--soft);color:var(--accent)}
.split-nav button.on{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:650}
.split-item{display:none}.split-item.on{display:block}
.split-item>h5:first-child{margin-top:0}
@media (max-width:760px){.split{grid-template-columns:1fr}.split-nav{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}.split-nav button{border:1px solid var(--line);border-radius:8px}}
@media print{.split{display:block}.split-nav{display:none}.split-item{display:block!important}}
</style></head>
<body>
<header class="bar"><button class="menu" id="menuBtn" type="button" aria-label="Mở mục lục" aria-expanded="false">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div class="bar-title"><strong>Analysis Report</strong><span>Hệ thống Quản lý và Đặt sân Thể thao</span></div>
<button class="hl-btn" id="hlBtn" type="button" aria-label="Chú giải và bộ lọc highlight" aria-expanded="false" aria-controls="hlPanel" title="Chú giải highlight"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 11l6 6M4 20l4.5-1 9.8-9.8a2.1 2.1 0 0 0 0-3L17 5a2.1 2.1 0 0 0-3 0L4.2 14.8 4 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M14 20h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div class="hl-panel" id="hlPanel" hidden role="dialog" aria-label="Highlight"></div><button class="theme" id="themeBtn" type="button" aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối"><svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></header>
<div class="shell">

</div>

# 2 Mô tả bài toán

#### Nghiệp vụ

Người chơi cầu lông, pickleball, bóng đá mini đặt sân qua điện thoại, Zalo hoặc Facebook. Chủ sân ghi lịch bằng sổ tay hoặc Excel, nhận cọc chuyển khoản và tự quyết định hoàn cọc. Ba vấn đề thường gặp: trùng lịch, hoàn cọc tùy chủ sân, giá đổi theo giờ cao điểm, cuối tuần, ngày lễ nên tính nhẩm dễ sai.

Hệ thống là ứng dụng web có ba nhóm người dùng:

- **Khách hàng** tìm sân còn trống, xem trước tổng tiền, đặt sân và đặt cọc 30% từ ví nội bộ, hủy sân và nhận hoàn cọc theo quy định.
- **Chủ sân** tạo cơ sở và sân con, cấu hình khung giờ, bảng giá, dịch vụ đi kèm; sau buổi chơi xác nhận hoàn tất để nhận tiền cọc.
- **Admin** cấp tiền vào ví người dùng, quản lý danh mục ngày lễ và kích hoạt dọn các đơn giữ chỗ hết hạn.

Mọi dòng tiền (cọc, hoàn cọc, tiền cọc bị mất, kết toán) đi qua ví nội bộ và được ghi thành giao dịch. Nạp và rút tiền thật nằm ngoài phạm vi.

#### Luồng nghiệp vụ chính

1. Khách tìm cơ sở theo môn, thành phố, từ khóa; xem lịch trống của sân con theo ngày.
2. Khách chọn các khung giờ, hệ thống tính tiền và tiền cọc. Khách tạo đơn, hệ thống giữ chỗ tối đa 10 phút (trạng thái `PENDING_DEPOSIT`).
3. Khách đặt cọc 30% từ ví trong thời gian giữ chỗ. Tiền chuyển sang ví hệ thống giữ hộ, đơn sang `DEPOSITED`, khung giờ bị khóa với mọi người khác.
4. Khách hủy: tiền cọc được hoàn hoặc mất theo mốc thời gian. Khách đến chơi: chủ sân xác nhận hoàn tất, tiền cọc chuyển từ ví hệ thống sang ví chủ sân, đơn sang `COMPLETED`.
5. Hết 10 phút mà chưa cọc, đơn tự hủy và khung giờ được nhả.

#### Quy định nghiệp vụ

| Mã | Nội dung |
| --- | --- |
| QĐ1 | Giờ thường: giá cơ sở. Giờ cao điểm, cuối tuần, ngày lễ: tăng 20%–50% so với giá cơ sở. Khung giờ thuộc nhiều quy tắc thì lấy hệ số cao nhất. |
| QĐ2 | Tổng tiền = giá khung giờ × hệ số thời điểm + phí dịch vụ đi kèm (nếu có). |
| QĐ3 | Khung giờ đã được đặt cọc sẽ bị khóa, không ai khác đặt được. |
| QĐ4 | Tiền cọc = 30% tổng tiền, trừ từ ví khách. Số tiền còn lại thanh toán tại sân hoặc chuyển khoản trước giờ chơi. |
| QĐ5 | Hủy từ 24 giờ trở lên trước giờ chơi: hoàn 80% cọc. Từ 12 đến dưới 24 giờ: hoàn 50%. Dưới 12 giờ: không hoàn. Tiền hoàn vào ví khách, phần không hoàn vào ví chủ sân. |
| QĐ6 | Mọi dòng tiền đi qua ví và được ghi thành giao dịch. Số dư ví không được âm. Tiền vào ví do Admin cấp. |
| QĐ7 | Trạng thái lịch đặt: Chờ đặt cọc (`PENDING_DEPOSIT`) → Đã đặt cọc (`DEPOSITED`) → Hoàn tất (`COMPLETED`); hoặc Đã hủy (`CANCELLED`). |

#### Môi trường hoạt động

- Client: trình duyệt web hỗ trợ HTML5/CSS3/JavaScript trên máy tính và điện thoại.
- Server: 1 vCPU, 1 GB RAM, 20 GB SSD.
- Dịch vụ ngoài: email Brevo; bản đồ Leaflet với dữ liệu OpenStreetMap.

#### Ràng buộc thiết kế và triển khai

- Frontend và Backend tách riêng, giao tiếp qua REST API (`/api/v1`, JSON).
- Frontend: React.js. Backend: Python (FastAPI). CSDL quan hệ: MySQL.
- Mật khẩu mã hóa bằng Bcrypt, giao tiếp qua HTTPS, xác thực bằng JWT.
- Tiền là số nguyên VNĐ; thời gian theo ISO 8601 UTC. Mọi tính toán tiền làm ở Backend, Frontend chỉ hiển thị.
- Mã nguồn quản lý bằng Git/GitHub.

#### Ngoài phạm vi

Ứng dụng di động riêng; nạp và rút tiền thật; SMS; chỉ đường trong ứng dụng; chủ sân đánh giá người chơi.

#### Thuật ngữ

| Thuật ngữ | Nghĩa |
| --- | --- |
| Cơ sở | Một cụm sân của một chủ sân, có địa chỉ và giờ mở cửa. |
| Sân con | Một sân cụ thể trong cơ sở (ví dụ Sân 1), thuộc một môn. |
| Khung giờ | Đơn vị thời gian nhỏ nhất có thể đặt của một sân con. |
| Giữ chỗ | Khóa tạm các khung giờ tối đa 10 phút để khách đặt cọc. |
| Tiền cọc | 30% tổng tiền, trừ từ ví khách khi đặt cọc. |
| Ví nội bộ | Tài khoản tiền trong hệ thống của mỗi người dùng; số dư không âm. |
| Ví hệ thống | Ví trung gian giữ tiền cọc cho đến khi hủy hoặc kết toán. |
| Hoàn cọc | Trả lại một phần tiền cọc vào ví khách khi hủy, theo QĐ5. |
| Kết toán | Chuyển tiền cọc từ ví hệ thống sang ví chủ sân sau buổi chơi. |
| Hệ số giá | Số nhân áp lên giá cơ sở ở giờ cao điểm, cuối tuần, ngày lễ. |

# 3 Tổng quan yêu cầu

#### 3.1 Danh sách các stakeholder

| STT | Stakeholder | Mô tả |
| --- | --- | --- |
| 1 | Khách hàng (người chơi) | Loại: end user. Tìm sân, đặt sân, đặt cọc, hủy, xem ví. Quan tâm giá rõ ràng và hoàn cọc công bằng. |
| 2 | Chủ sân | Loại: end user. Sở hữu cơ sở và sân con, đặt giá, nhận đơn, xác nhận hoàn tất, nhận tiền kết toán. Quan tâm không bị trùng lịch và được bồi thường khi khách hủy muộn. |
| 3 | Admin | Loại: system manager. Cấp tiền vào ví, quản lý ngày lễ, dọn đơn giữ chỗ hết hạn. |
| 4 | Đội phát triển (nhóm 6) | Loại: system manager. Xây dựng, kiểm thử, vận hành hệ thống. |
| 5 | Giảng viên môn Nhập môn CNPM | Loại: external stakeholder. Người đặt yêu cầu và đánh giá đồ án. |
| 6 | Dịch vụ email Brevo | Loại: external stakeholder. Bên ngoài, gửi email cho hệ thống. |
| 7 | Dịch vụ bản đồ OpenStreetMap / Leaflet | Loại: external stakeholder. Bên ngoài, cung cấp bản đồ hiển thị vị trí sân. |
| 8 | Bên cung cấp hosting/VPS | Loại: external stakeholder. Cung cấp máy chủ và MySQL. |

```text
                Khách hàng        Chủ sân          Admin
                    │                │                │
                    ▼                ▼                ▼
        ┌─────────────────────────────────────────────────┐
        │   Hệ thống Quản lý và Đặt sân Thể thao          │
        └─────────────────────────────────────────────────┘
                    │                │                │
                    ▼                ▼                ▼
             Email Brevo      OpenStreetMap       Hosting/VPS
```

#### 3.2 Danh sách yêu cầu

`FR-xx`: yêu cầu chức năng; `NFR-xx`: yêu cầu phi chức năng.

#### 3.2.2 Đặc tả yêu cầu phi chức năng

| User Story | Requirement | Details |
| --- | --- | --- |
| Là khách hàng, tôi muốn trang tải nhanh để không phải chờ khi tìm sân. | NFR-01 Hiệu năng giao diện (sản phẩm – hiệu năng) | Trang tìm sân và lịch trống hiển thị trong tối đa 3 giây ở 95% lượt tải, mạng 4G, khi dữ liệu ở mức 50 cơ sở. |
| Là khách hàng, tôi muốn thao tác đặt sân phản hồi ngay. | NFR-02 Thời gian phản hồi API (sản phẩm – hiệu năng) | 95% request đọc phản hồi dưới 1 giây, request ghi (đặt, cọc, hủy) dưới 2 giây, với 20 người dùng đồng thời trên máy chủ 1 vCPU, 1 GB RAM. |
| Là chủ sân, tôi muốn không bao giờ bị đặt trùng giờ. | NFR-03 Toàn vẹn khi đồng thời (sản phẩm – độ tin cậy) | Khi 2 yêu cầu đặt cùng sân, ngày, khung giờ chạy đồng thời, đúng 1 yêu cầu thành công, 0 trường hợp hai đơn còn hiệu lực trên cùng khung giờ. |

Tiền điều kiện chung: người dùng dùng trình duyệt có Internet; use case yêu cầu đăng nhập thì phải có phiên đăng nhập hợp lệ.

| Use case ID | U001 |

##### U016 – Đặt cọc

| Mục | Nội dung |

| Use case ID | U016 |
| Tên Use Case | Đặt cọc 30% bằng ví |

| Kết quả | Thành công: Đơn sang `DEPOSITED`; ví khách giảm, ví hệ thống tăng đúng tiền cọc; có 1 giao dịch `DEPOSIT`; khung giờ bị khóa với mọi người (QĐ3).<br>Thất bại: Đơn giữ nguyên trạng thái, ví không đổi, không có giao dịch. |
| Kịch bản chính | 1. Khách mở đơn và bấm đặt cọc.<br>2. Hệ thống kiểm tra đơn còn hạn và đang chờ cọc.<br>3. Hệ thống kiểm tra số dư đủ.<br>4. Hệ thống trừ ví khách, cộng ví hệ thống, ghi giao dịch `DEPOSIT`, chuyển đơn sang `DEPOSITED`.<br>5. Hệ thống báo thành công và số dư mới.<br>6. Hệ thống gửi email xác nhận đặt sân (FR-30). |

| Ràng buộc phi chức năng | Trừ tiền, cộng tiền, ghi giao dịch và đổi trạng thái đơn xảy ra cùng lúc hoặc không xảy ra gì; số dư không âm (QĐ4, QĐ6, NFR-04). |

##### U017 – Hủy đơn và hoàn cọc

| Mục | Nội dung |
| --- | --- |
| Use case ID | U017 |
| Tên Use Case | Hủy đơn và hoàn cọc |
| Yêu cầu liên quan | FR-19, FR-20 |
| Tóm tắt | Khách xem trước tiền hoàn, rồi hủy đơn. Hệ thống tự chia tiền cọc giữa ví khách và ví chủ sân theo QĐ5. |
| Tác nhân | Khách hàng (Admin cũng làm được) |
| Điều kiện tiên quyết | Đã đăng nhập; là chủ đơn (hoặc Admin); đơn ở `PENDING_DEPOSIT` hoặc `DEPOSITED`; chưa đến giờ chơi. |
| Kết quả | Thành công: Đơn `CANCELLED`; khung giờ được nhả. Nếu đơn đã cọc: tiền hoàn về ví khách và phần còn lại về ví chủ sân.<br>Thất bại: Đơn giữ nguyên trạng thái, không hoàn tiền. |
| Kịch bản chính | 1. Khách mở đơn và bấm hủy.<br>2. Hệ thống tính số giờ còn lại và trả tỉ lệ hoàn (≥24 giờ: 80%, 12 đến dưới 24 giờ: 50%, dưới 12 giờ: 0%) cùng số tiền.<br>3. Khách đọc, nhập lý do và xác nhận.<br>4. Hệ thống đổi đơn sang `CANCELLED`, nhả khung giờ.<br>5. Nếu đơn đã cọc: ghi `REFUND` về ví khách và `FORFEIT` về ví chủ sân (phần không hoàn).<br>6. Hệ thống báo số tiền hoàn và số dư ví mới. |
| Kịch bản phụ | 4a. Đơn đã hủy, đã hoàn tất hoặc đã qua giờ chơi: từ chối và báo lý do.<br>3a. Khách bỏ qua xác nhận: không đổi gì.<br>5a. Đơn chưa cọc: không có giao dịch ví.<br>Ví dụ: cọc 39.000đ, hủy còn 30 giờ: hoàn 31.200đ, chủ sân nhận 7.800đ. |
| Ràng buộc phi chức năng | Giao diện không tự tính hoàn cọc (NFR-09). Hoàn cọc và đổi trạng thái đơn xảy ra cùng lúc (NFR-04). Bài đăng tìm đồng đội liên quan bị đóng. |
